# Configuracion Nginx para CatalogoHN en DigitalOcean Droplet (IP: 162.243.87.47)
# Redireccion automatica de preview.catalogohn.com hacia el dominio oficial catalogohn.com

# 1. API Backend (https://api.catalogohn.com)
server {
    listen 80;
    server_name api.catalogohn.com api-preview.catalogohn.com;

    location / {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 20M;
    }
}

# 2. Redireccion Automatica (preview.catalogohn.com -> catalogohn.com)
# Mantiene a los clientes del link viejo navegando automaticamente en el nuevo dominio principal
server {
    listen 80;
    server_name preview.catalogohn.com;
    return 301 https://catalogohn.com$request_uri;
}

# 3. Frontend Produccion (https://catalogohn.com y subdominios de inquilinos *.catalogohn.com)
server {
    listen 80;
    server_name catalogohn.com *.catalogohn.com;

    root /var/www/catalogohn/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /uploads/ {
        proxy_pass http://localhost:3001/uploads/;
    }
}

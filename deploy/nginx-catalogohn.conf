# Configuracion Nginx para CatalogoHN en DigitalOcean Droplet (IP: 162.243.87.47)

# 1. API Backend (https://api.catalogohn.com)
server {
    listen 80;
    server_name api.catalogohn.com;

    location / {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 20M;
    }
}

# 2. Frontend Produccion (https://catalogohn.com y *.catalogohn.com)
server {
    listen 80;
    server_name catalogohn.com *.catalogohn.com;

    root /var/www/catalogohn/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /uploads/ {
        proxy_pass http://localhost:3001/uploads/;
    }
}

# 3. Frontend Preview (https://preview.catalogohn.com)
server {
    listen 80;
    server_name preview.catalogohn.com;

    root /var/www/catalogohn-preview/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
